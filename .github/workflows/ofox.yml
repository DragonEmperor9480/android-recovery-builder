name: "Orange Fox builder"

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: "OrangeFox branch"
        required: true
        default: "12.1"
        type: choice
        options: ["12.1", "14.1"]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Setup Build Env
        run: |
          sudo apt-get update
          git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master ~/scripts
          cd ~/scripts
          sudo bash setup/android_build_env.sh

      - name: Sync OrangeFox source
        run: |
          git clone https://gitlab.com/OrangeFox/sync.git -b master ~/sync
          cd ~/sync
          ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ~/fox
          
      - name: Setup DT
        working-directory: /home/runner/fox
        run: |
            git clone https://github.com/DragonEmperor9480/recovery_device_realme_RMX3371.git device/realme/RMX3371
      - name: Add swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build Ofox
        working-directory: /home/runner/fox
        run: |
            set +e
            source build/envsetup.sh
            set -e
            if [ "${{ inputs.MANIFEST_BRANCH }}" = "14.1" ]; then
              lunch twrp_RMX3371-ap2a-eng
            else
              lunch twrp_RMX3371-eng
            fi
            mka adbd recoveryimage
        
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-RMX3371-${{ github.run_number }}
          if-no-files-found: error
          path: |
            /home/runner/fox/out/target/product/RMX3371/OrangeFox*.img
            /home/runner/fox/out/target/product/RMX3371/OrangeFox*.zip
